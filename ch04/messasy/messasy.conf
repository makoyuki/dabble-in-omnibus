ListenIP=【インストールするホストのIP】
ListenPort=【任意のポート】
TimeOut=10
SyslogFacility=local1
ErrorAction=accept
CommandPort=17777
AdminPassword=★★★★★★
CommandMaxClients=16
CommandTimeOut=300

SavePolicy=both
MyDomain=【アーカイブ対象ドメイン】
SaveMailAddress=@【アーカイブ対象ドメイン】
SaveIgnoreHeader=
DefaultDomain=【アーカイブ対象ドメイン】
ここ以降はモジュールの設定。利用するモジュールの設定のみ行う。
# for maildrop module
MailDir=/local/messasy/maildrop/Maildir
MailFolder=.%y.%m.%d
DotDelimiter=,
SlashDelimiter=_

# for gzip module
#GzipMailDir=/local/messasy/gzip/Maildir
#GzipMailFolder=.%y.%m.%d
#GzipDotDelimiter=,
#GzipSlashDelimiter=_
#GzipCommand=/usr/bin/gzip

# for enczip
EncZipMailDir=/local/messasy/enczip/Maildir
EncZipMailFolder=.%y.%m.%d
EncZipDotDelimiter=,
EncZipSlashDelimiter=_
EncZipCommand=/usr/bin/zip
EncZipPassword=1234abc ★左記は例。記号が利用できない(エラーになる)ため英数文字のみで設定する。
