domain-needed
 #ドメインパートが無い場合、上位サーバに問い合わせない
bogus-priv
 #名前解決できないプライベートIPv4アドレスを上位サーバに問い合わせない。
no-resolv
 #resolv.conf のDNSサーバ定義を無視。
no-poll
 #resolv.confの変更を無視。
server=192.168.x.x
server=8.8.8.8
server=8.8.4.4
 #上位(DNS)サーバを指定。複数指定可能
local=/local.test/
 #ローカルドメインの指定。ローカルファイルのみで名前解決を試みる
address=/userdes.test.com/192.168.100.90
address=/meet.test.com/192.168.100.90
address=/chat.test.com/192.168.100.90
address=/drv.test.com/192.168.100.90
 #address=/条件/IPアドレス の書式で、ローカルIPを応答するように設定します。
 #これは、インターネット側からアクセスをする際に、設定したドメイン(上記でいえばuserdata.test.com) はDDNSで登録されたグローバルなIPアドレスにアクセスしてきます。
 #ルータはポート開放をして、インターネット側からのアクセスを特定のサーバにポート転送します。しかし、ローカルからアクセスした際にインターネット側で名前解決されてしまうと正常にアクセスできません。そこで、ローカルでDDNS登録したドメインを名前解決する際には、上記のようにローカルでのIPアドレスを応答するように設定します。
no-hosts
 #サーバ上の/etc/hostsで名前解決をさせない
ddn-hosts=/etc/dnsmasq_static_hosts.conf
a
 #個別にhosts形式のファイルを用意して名前解決する
xpand-hosts
e
 #ドメイン名を自動的に付加する
omain=fnow.test
d
 #ローカルのドメインを指定
log-queries
 #クエリログを出力する
log-facility=/var/log/dnsmasq/dnsmasq.log
 #ログファイルの指定
