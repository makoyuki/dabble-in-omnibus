#---------------------------------------------------------------------
# Global settings
#---------------------------------------------------------------------
global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    stats timeout 30s
    user haproxy
    group haproxy
    daemon
    # Default SSL material locations
    ca-base /etc/ssl/certs
    crt-base /etc/ssl/private
    # Security
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

#---------------------------------------------------------------------
# Defaults
#---------------------------------------------------------------------
defaults
    log global
    mode tcp
    option tcplog
    option dontlognull
    timeout connect 5000ms
    timeout client 50000ms
    timeout server 50000ms
    retries 3
    option redispatch

#---------------------------------------------------------------------
# HAProxy Statistics
#---------------------------------------------------------------------
listen stats
    bind *:8080
    mode http
    stats enable
    stats uri /stats
    stats realm HAProxy\ Statistics
    stats auth admin:P@ssw0rd123 # 任意のものに変更
    stats refresh 30s

#---------------------------------------------------------------------
# LDAP Read Frontend (参照用 - ロードバランス)
#---------------------------------------------------------------------
frontend ldap_read_frontend
    bind *:389
    mode tcp
    option tcplog
    default_backend ldap_read_backend

backend ldap_read_backend
    mode tcp
    balance roundrobin
    option tcp-check
    # LDAP Health Check (簡易的なTCP接続確認)
    tcp-check connect
    tcp-check send-binary 300c0201 # LDAP Bind Request (簡易版)
    tcp-check send-binary 01       # Version
    tcp-check send-binary 6007     # Bind DN (anonymous)
    tcp-check send-binary 0a010380 # Simple auth
    tcp-check send-binary 00
    tcp-check expect binary 0a01   # Expecting success (resultCode: success)
    # Backend Servers
    server ldap-active  192.168.100.101:389 check inter 3000 fall 3 rise 2
    server ldap-standby 192.168.100.102:389 check inter 3000 fall 3 rise 2

#---------------------------------------------------------------------
# LDAP Write Frontend (更新用 - Active優先)
#---------------------------------------------------------------------
frontend ldap_write_frontend
    bind *:3389
    mode tcp
    option tcplog
    default_backend ldap_write_backend

backend ldap_write_backend
    mode tcp
    balance roundrobin
    option tcp-check
    # LDAP Health Check
    tcp-check connect
    # Backend Servers (Standbyはbackup指定)
    server ldap-active  192.168.100.101:389 check inter 3000 fall 3 rise 2
    server ldap-standby 192.168.100.102:389 check inter 3000 fall 3 rise 2 backup
